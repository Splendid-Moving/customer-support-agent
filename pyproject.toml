[project]
name = "splendid-support-agent"
version = "0.1.0"
description = "Customer-facing support agent for Splendid Moving"
requires-python = ">=3.12,<3.13"

dependencies = [
    # LangChain 1.0 LTS — do not drop to 0.3, it is maintenance-only
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langsmith>=0.3.0",

    # Model backends. OpenAI for testing, OpenRouter is the destination.
    "langchain-openai>=1.0,<2.0",

    # Web layer: the chat page, the SSE stream, and the photo upload endpoint.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",

    # Checkpointer. The estimate form cannot pause and resume without one.
    "langgraph-checkpoint-sqlite>=2.0",

    "requests>=2.31",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.1.55",
    "pytest>=8.0",
    "httpx>=0.27",          # fastapi TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "services", "schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Model-calling tests are opt-in: `pytest -m live`
addopts = "-m 'not live'"
markers = [
    "live: hits a real model or API (costs money, needs network)",
]
