<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fbfbfa" />
<title>Splendid Moving — chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
<style>
/* ─────────────────────────────────────────────────────────────
   The customer chat page. Flat and neutral: an off-white page,
   white surfaces with hairline borders and near-black text.
   The welcome screen has one short greeting and a quiet list of
   conversation starters. Replies read as plain text under a name
   label; customer messages sit in soft grey bubbles.
   ───────────────────────────────────────────────────────────── */

:root {
  --page:        #fbfbfa;
  --surface:     #ffffff;
  --ink:         #1b1c1e;
  --text:        #2b2c2f;
  --muted:       #6f7277;
  --faint:       #a2a5aa;
  --line:        #e8e8e5;
  --line-strong: #d6d6d2;
  --fill:        #f3f3f1;
  --fill-strong: #e9e9e6;
  --danger:      #b42318;

  --shadow: 0 1px 2px rgba(20, 20, 20, .04), 0 6px 20px -8px rgba(20, 20, 20, .08);

  --sans: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --gut: clamp(1rem, 4.5vw, 1.5rem);
  --column: 44rem;
  --ease: cubic-bezier(.2, .8, .2, 1);

  color-scheme: light;
}

* { box-sizing: border-box; }

/* `hidden` must win over any author `display`, e.g. `.icon { display: grid }`. */
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }

body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.ph-light { line-height: 1; }

.app {
  height: 100dvh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}

/* Header, thread and composer all share one centered column. */
.column { width: 100%; max-width: var(--column); margin: 0 auto; padding: 0 var(--gut); }

/* ── Header ───────────────────────────────────────────────── */

header.bar {
  position: relative;
  border-bottom: 1px solid var(--line);
  background: var(--page);
}
.bar .column {
  display: flex; align-items: center; gap: .7rem;
  padding-top: calc(.75rem + env(safe-area-inset-top));
  padding-bottom: .75rem;
}

.avatar {
  width: 32px; height: 32px; flex: none;
  border-radius: 50%;
  display: block;
  object-fit: contain;
}

.who-name { font-weight: 600; font-size: .93rem; letter-spacing: -.01em; line-height: 1.3; white-space: nowrap; }

.bar .grow { flex: 1; }

/* A ghost button: no fill until you point at it. */
.linkbtn {
  display: inline-flex; align-items: center; gap: .4rem;
  border: 1px solid var(--line); background: var(--surface);
  font: inherit; font-size: .84rem; font-weight: 500; color: var(--text);
  padding: 0 .8rem; min-height: 36px; border-radius: 999px;
  cursor: pointer; white-space: nowrap;
  transition: background .15s, border-color .15s;
}
.linkbtn .ph-light { font-size: 1rem; }
.linkbtn:hover { background: var(--fill); border-color: var(--line-strong); }
@media (max-width: 480px) {
  .linkbtn { width: 36px; height: 36px; padding: 0; justify-content: center; }
  .linkbtn__label {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
}

/* Progress along the bottom of the header during the interview. */
.rail { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; }
.rail i {
  display: block; height: 100%; width: 0;
  background: var(--ink);
  transition: width .5s var(--ease);
}

/* ── Thread ───────────────────────────────────────────────── */

.thread {
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.thread::-webkit-scrollbar { width: 7px; }
.thread::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 99px; }

.thread .column {
  min-height: 100%;
  display: flex; flex-direction: column;
  padding-top: clamp(1.25rem, 5vw, 2.25rem);
  padding-bottom: 1rem;
}
/* Nothing in the transcript may shrink to fit: a flex item with overflow:hidden
   (the read-back) otherwise squashes and cuts off instead of scrolling. */
.thread .column > * { flex-shrink: 0; }

/* One invitation and one list: each shortcut has the same quiet weight. */
.hello {
  margin: auto 0;
  padding: 1rem 0 1.5rem;
}
.hello h1 {
  margin: 0 0 .65rem;
  font-weight: 500;
  font-size: clamp(1.85rem, 6.5vw, 2.25rem);
  line-height: 1.15;
  letter-spacing: -.03em;
}
.hello p {
  margin: 0;
  color: var(--muted); font-size: .95rem; line-height: 1.55;
}

.asked { margin-top: 1.75rem; }
.asked h2 {
  margin: 0 0 .35rem;
  font-size: .8rem; font-weight: 500; color: var(--muted);
}
.chip {
  display: flex; align-items: center; justify-content: space-between; gap: .75rem;
  width: 100%; min-height: 44px; padding: .55rem 0;
  font: inherit; font-size: .95rem; color: var(--text); text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: color .15s, background .15s;
}
.chip:last-child { border-bottom: 0; }
.chip .ph-light { font-size: 1rem; flex: none; color: var(--faint); }
.chip:hover { color: var(--ink); background: var(--fill); }
.chip:hover .ph-light { color: var(--ink); }

.reveal { animation: fade .35s var(--ease) both; }
@keyframes fade {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

/* Messages */
.msg { margin-bottom: 1.5rem; font-size: .98rem; }

/* The agent's reply: plain text under a small name label, no bubble. */
.msg.them {
  align-self: stretch;
  max-width: 62ch;
  white-space: pre-wrap;
  color: var(--text);
  line-height: 1.65;
}
.msg.them::before {
  content: attr(data-label);
  display: block;
  margin-bottom: .2rem;
  font-size: .8rem; font-weight: 600; color: var(--ink);
  white-space: normal;
}
.msg.them p { margin: 0 0 .75rem; }
.msg.them p:last-child { margin-bottom: 0; }

/* The customer's own words, in a soft grey bubble on the right. */
.msg.me {
  align-self: flex-end;
  width: fit-content;
  max-width: min(40ch, 85%);
  background: var(--fill);
  color: var(--ink);
  padding: .55rem .95rem;
  border-radius: 18px 18px 6px 18px;
}

/* ── The question card ───────────────────────────────────── */

.qcard {
  max-width: var(--column);
  margin-bottom: 1rem;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* The question; under it, a thin progress bar with the count at its end. */
.qcard__head {
  display: flex; align-items: center; flex-wrap: wrap; gap: .4rem .75rem;
  padding: .95rem 1rem .8rem;
  border-bottom: 1px solid var(--line);
}
.qcard__q {
  flex-basis: 100%;
  font-size: 1rem; font-weight: 500; line-height: 1.45;
  white-space: pre-wrap;
}
.qcard__count {
  order: 3;
  font-size: .76rem; color: var(--muted); white-space: nowrap;
}
.qcard__meter { order: 2; flex: 1; display: flex; gap: 3px; }
.qcard__meter span { flex: 1; height: 3px; border-radius: 99px; background: var(--fill-strong); }
.qcard__meter span.done, .qcard__meter span.now { background: var(--ink); }
.qcard__head:not(:has(.qcard__count)) { border-bottom: 0; }

.qcard__row {
  display: flex; align-items: center; gap: .75rem;
  width: 100%;
  padding: .55rem 1rem;
  border: 0;
  background: none; color: var(--text);
  font: inherit; font-size: .95rem; text-align: left;
  cursor: pointer; min-height: 50px;
  transition: background .12s;
}
.qcard__row + .qcard__row { border-top: 1px solid var(--line); }
.qcard__row:hover { background: var(--fill); }
.qcard__label { flex: 1; min-width: 0; }

/* Index badge: a label for the list, not a keyboard shortcut. */
.qcard__n {
  display: grid; place-items: center;
  width: 26px; height: 26px; flex-shrink: 0;
  border-radius: 8px;
  border: 1px solid var(--line);
  font-size: .78rem; color: var(--muted);
  transition: background .12s, color .12s, border-color .12s;
}
.qcard__n .ph-light { font-size: .95rem; }
.qcard__row:hover .qcard__n { background: var(--ink); border-color: var(--ink); color: #fff; }

.qcard__go { font-size: .95rem; color: var(--faint); transition: transform .15s var(--ease), color .15s; }
.qcard__row:hover .qcard__go { color: var(--ink); transform: translateX(2px); }

.qcard__row--quiet { color: var(--muted); }
.qcard__row--quiet:hover .qcard__n { background: var(--fill-strong); border-color: var(--line-strong); color: var(--ink); }

/* The confirm step after a date is picked. */
.qcard__row--use { color: var(--ink); font-weight: 500; }
.qcard__row--use .qcard__n { background: var(--ink); border-color: var(--ink); color: #fff; }

/* The platform date control, invisible and covering its whole row, so a tap
   anywhere opens the native picker while the row shows our own label. */
.qcard__row--date { position: relative; }
.qcard__date {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  margin: 0; padding: 0; border: 0;
  opacity: 0; font: inherit; cursor: pointer;
}
.qcard__aside {
  margin-left: auto;
  font-size: .8rem; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px;
  padding: .2rem .7rem; background: var(--surface);
}
.qcard__aside:hover { background: var(--fill); color: var(--ink); }

/* The slot the questions move through, one card at a time. */
.slot { position: relative; margin-bottom: .6rem; }
.slot:empty { display: none; }
.slot .qcard {
  margin-bottom: 0;
  max-height: 58vh;
  overflow-y: auto;
  overscroll-behavior: contain;
}

/* Under 400ms: showCard removes the old card on a 400ms timer. */
.qcard--in { animation: card-in .3s var(--ease) both; }
.qcard--out {
  position: absolute; inset: 0;
  animation: card-out .2s ease both;
  pointer-events: none;
}
@keyframes card-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}
@keyframes card-out {
  from { opacity: 1; }
  to   { opacity: 0; transform: translateY(-4px); }
}

/* The read-back before anything is sent: something to check, not read. */
.recap {
  width: 100%;
  margin-bottom: 1.5rem;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.recap dl { margin: 0; display: grid; grid-template-columns: minmax(8rem, auto) 1fr; }
.recap dt, .recap dd {
  margin: 0;
  padding: .6rem 1rem;
  border-bottom: 1px solid var(--line);
  font-size: .92rem;
}
.recap dt { color: var(--muted); font-size: .85rem; }
.recap dd { color: var(--ink); font-weight: 500; overflow-wrap: anywhere; }
.recap dl > :nth-last-child(-n+2) { border-bottom: 0; }
.recap .pics {
  display: flex; align-items: center; gap: .45rem;
  padding: .6rem 1rem;
  border-top: 1px solid var(--line);
  font-size: .86rem; color: var(--muted);
}
.recap .pics .ph-light { font-size: 1.05rem; }
@media (max-width: 480px) {
  .recap dl { grid-template-columns: 1fr; }
  .recap dt { padding-bottom: 0; border-bottom: 0; }
  .recap dd { padding-top: .1rem; }
}

/* The caret that follows the streaming text. */
.caret {
  display: inline-block;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--ink);
  margin-left: 4px;
  vertical-align: .05em;
  animation: blink 1s ease-in-out infinite;
}
@keyframes blink { 50% { opacity: .2; } }

.thinking { display: flex; gap: 5px; margin-bottom: 1.5rem; padding: .5rem 0; }
.thinking i {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--faint);
  animation: bob 1.2s ease-in-out infinite;
}
.thinking i:nth-child(2) { animation-delay: .15s; }
.thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 60%, 100% { opacity: .35; } 30% { opacity: 1; } }

/* ── Composer ─────────────────────────────────────────────── */

footer.composer .column {
  padding-top: .5rem;
  padding-bottom: calc(.7rem + env(safe-area-inset-bottom));
}

/* Photo thumbnails and the read-back's buttons sit above the input. */
.assist { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem; margin-bottom: .6rem; }
.assist:empty { display: none; }

.opt {
  display: inline-flex; align-items: center; gap: .45rem;
  font: inherit; font-size: .9rem; font-weight: 500;
  padding: 0 1rem; min-height: 40px;
  border-radius: 999px;
  border: 1px solid var(--ink);
  background: var(--ink); color: #fff;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.opt .ph-light { font-size: 1.05rem; }
.opt:hover { background: #333438; border-color: #333438; }
.opt.quiet { background: var(--surface); color: var(--text); border-color: var(--line); }
.opt.quiet:hover { background: var(--fill); border-color: var(--line-strong); }

.box {
  display: flex; align-items: flex-end; gap: .35rem;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 18px;
  padding: .4rem .4rem .4rem 1.05rem;
  box-shadow: var(--shadow);
  transition: border-color .15s, box-shadow .15s;
}
.box:focus-within { border-color: #b9b9b4; box-shadow: 0 1px 2px rgba(20, 20, 20, .05), 0 8px 24px -8px rgba(20, 20, 20, .12); }

.box textarea, .box input[type="date"] {
  flex: 1; border: 0; background: none; color: inherit;
  font: inherit; outline: none; resize: none;
  padding: .55rem 0; max-height: 120px; line-height: 1.5;
  min-width: 0;
}
.box textarea::placeholder { color: var(--faint); }

.icon {
  width: 38px; height: 38px; flex: none;
  border: 0; border-radius: 50%;
  background: none; color: var(--muted);
  display: grid; place-items: center; cursor: pointer;
  font-size: 1.25rem;
  transition: background .15s, color .15s;
}
.icon:hover { background: var(--fill); color: var(--ink); }

.go {
  width: 38px; height: 38px; flex: none;
  border: 0; border-radius: 50%;
  background: var(--ink); color: #fff;
  display: grid; place-items: center; cursor: pointer;
  font-size: 1.1rem;
  transition: background .15s, color .15s;
}
.go:hover:not(:disabled) { background: #333438; }
.go:disabled { cursor: default; background: var(--fill-strong); color: var(--faint); }

.foot {
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: .3rem;
  margin: .55rem 0 0;
  font-size: .76rem; color: var(--muted);
}
.foot a { color: var(--text); text-decoration: none; font-weight: 500; }
.foot a:hover { text-decoration: underline; }

/* Builder credit: findable, not noticeable. */
.by { margin: .2rem 0 0; text-align: center; font-size: .7rem; }
.by a { color: var(--faint); text-decoration: none; }
.by a:hover { color: var(--muted); text-decoration: underline; }

/* Photo thumbnails */
.shot {
  position: relative; width: 54px; height: 54px;
  border-radius: 10px; overflow: hidden;
  border: 1px solid var(--line);
  animation: fade .25s var(--ease) both;
}
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot.pending img { opacity: .35; }
.shot.pending::after {
  content: ""; position: absolute; inset: 0; margin: auto;
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .9); border-top-color: var(--ink);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.shot button {
  position: absolute; top: 3px; right: 3px;
  width: 19px; height: 19px; border: 0; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(27, 28, 30, .75); color: #fff;
  font-size: .68rem; cursor: pointer; padding: 0;
}

.warn {
  display: flex; align-items: center; gap: .35rem;
  color: var(--danger); font-size: .84rem; flex-basis: 100%;
}

/* One focus style for everything you can tab to. */
:is(.linkbtn, .chip, .qcard__row, .qcard__aside, .opt, .icon, .go, .shot button, .foot a, .by a):focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}
.qcard__row:focus-visible { outline-offset: -2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .reveal { opacity: 1; }
}
</style>
</head>
<body data-agent="{{AGENT_NAME}}">

<div class="app">
  <header class="bar">
    <div class="column">
      <img class="avatar" src="/logo.png" width="32" height="32" alt="" />
      <div class="who-name">Splendid Moving</div>
      <div class="grow"></div>
      <button class="linkbtn" id="restart" type="button"><i class="ph-light ph-arrow-counter-clockwise" aria-hidden="true"></i><span class="linkbtn__label">Start over</span></button>
    </div>
    <div class="rail"><i id="rail"></i></div>
  </header>

  <main class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation">
    <div class="column" id="messages">
      <div class="hello" id="hello">
        <h1 class="reveal">Ask me anything.</h1>
        <p class="reveal" style="animation-delay:.05s">I'm {{AGENT_NAME}}, here to help with your move.</p>
        <!-- Each shortcut sends its visible text. Keep the two estimate
             starters alongside the questions, with no separate promotion. -->
        <div class="asked reveal" style="animation-delay:.1s">
          <h2>Start here</h2>
          <button class="chip" type="button">I'd like an estimate<i class="ph-light ph-arrow-right" aria-hidden="true"></i></button>
          <button class="chip" type="button">Moving out of state<i class="ph-light ph-arrow-right" aria-hidden="true"></i></button>
          <button class="chip" type="button">What's included?<i class="ph-light ph-arrow-right" aria-hidden="true"></i></button>
          <button class="chip" type="button">Any hidden fees?<i class="ph-light ph-arrow-right" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>
  </main>

  <footer class="composer">
    <div class="column">
      <!-- The interview happens here: one card, held above the composer. -->
      <div class="slot" id="slot" aria-live="polite"></div>
      <div class="assist" id="assist"></div>
      <div class="box" id="box">
        <textarea id="input" rows="1" placeholder="Ask about your move…"
                  aria-label="Your message" autocomplete="off"></textarea>
        <button class="icon" id="clip" type="button" aria-label="Add photos" hidden>
          <i class="ph-light ph-paperclip" aria-hidden="true"></i>
        </button>
        <input type="file" id="picker" accept="image/*" multiple hidden />
        <button class="go" id="send" type="button" aria-label="Send" disabled>
          <i class="ph-light ph-arrow-up" aria-hidden="true"></i>
        </button>
      </div>
      <p class="foot">Or call any day, 6am–11pm: <a href="tel:+13236452636">(323) 645-2636</a></p>
      <p class="by"><a href="https://simple-flow.co" target="_blank" rel="noopener noreferrer">Built by Simple&nbsp;Flow</a></p>
    </div>
  </footer>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   Three things in here are load-bearing.

   1. THE RESUME PROTOCOL. While the agent is part-way through
      the estimate questions the server is genuinely paused. An
      ordinary chat message at that point would restart the whole
      conversation, so answers go out as {reply: ...} instead.

   2. TOKENS ARRIVE BEFORE THE ANSWER IS APPROVED. The server
      streams the model's draft as it is written, and the voice
      and pricing checks only finish afterwards. If the draft is
      rejected the `done` event carries corrected text, and we
      swap it in. Usually it doesn't, and nothing happens.

   3. PHOTOS UPLOAD SEPARATELY, before the answer is sent. Only
      their ids ever travel through the conversation.
   ───────────────────────────────────────────────────────────── */

const el = (id) => document.getElementById(id);
const thread = el("thread"), input = el("input"), sendBtn = el("send");
const assist = el("assist"), clip = el("clip"), picker = el("picker"), rail = el("rail");
const slot = el("slot"), messages = el("messages");
const agentName = document.body.dataset.agent;

/* Deliberately NOT persisted. A reload starts a fresh conversation.
   The thread id used to live in localStorage and outlive the page, which meant
   a reloaded page drew the welcome screen while the server was still waiting on
   a question — and the first chip tapped was sent as the ANSWER to that unseen
   question. The interview is short enough that starting over costs less than
   any of the ways of putting someone back where they were. */
let threadId = "";
let busy = false;
let asking = null;      // the question the agent is currently waiting on
let photos = [];        // [{id, url}] for the photo step

/** A Phosphor icon, hidden from screen readers and from innerText. */
function icon(name) {
  const i = document.createElement("i");
  i.className = "ph-light ph-" + name;
  i.setAttribute("aria-hidden", "true");
  return i;
}

/* ── Rendering ─────────────────────────────────────────────── */

function stripHello() { const h = el("hello"); if (h) h.remove(); }

function bubble(who, text) {
  stripHello();
  const row = document.createElement("div");
  row.className = "msg " + who + " reveal";
  // The name label above each reply is drawn by CSS from this attribute, so
  // rewriting the reply's text never removes it.
  if (who === "them") row.dataset.label = agentName;
  row.textContent = text || "";
  messages.appendChild(row);
  scroll();
  return row;
}

function thinking(on) {
  const existing = el("dots");
  if (!on) { if (existing) existing.remove(); return; }
  if (existing) return;
  const row = document.createElement("div");
  row.className = "thinking"; row.id = "dots";
  row.innerHTML = "<i></i><i></i><i></i>";
  messages.appendChild(row);
  scroll();
}

let pinned = true;
thread.addEventListener("scroll", () => {
  pinned = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 60;
});
function scroll() {
  if (!pinned) return;
  requestAnimationFrame(() => { thread.scrollTop = thread.scrollHeight; });
}

/**
 * The hairline across the bottom of the header.
 *
 * Ambient only. The number a customer actually wants — "3 of 9" — is on the
 * question card, where they are already looking.
 */
function progress(step, total) {
  rail.style.width = step && total ? Math.round((step / total) * 100) + "%" : "0";
}

/* ── Talking to the server ─────────────────────────────────── */

async function post(payload, onToken) {
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ thread_id: threadId, ...payload }),
  });

  if (!res.ok) {
    let msg = "Something went wrong on my end. Try again in a moment?";
    try { msg = (await res.json()).error || msg; } catch (_) {}
    return { event: "done", reply: msg };
  }

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", last = null;

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });

    let cut;
    while ((cut = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0, cut).trim();
      buf = buf.slice(cut + 2);
      if (!raw.startsWith("data:")) continue;
      let evt; try { evt = JSON.parse(raw.slice(5)); } catch (_) { continue; }

      if (evt.event === "start") {
        // Held for this page view only, so the rest of the conversation lands
        // on the same thread.
        threadId = evt.thread_id;
      } else if (evt.event === "token") {
        onToken(evt.text);
      } else {
        last = evt;
      }
    }
  }
  return last || { event: "done", reply: "I lost that one — say it again?" };
}

async function exchange(payload, echo) {
  if (busy) return;
  busy = true;
  asking = null;
  // The card stays put while the server thinks. `showCard` swaps it when the
  // next question arrives; `clearSlot` takes it away if none does.
  progress(0, 0);
  if (echo) bubble("me", echo);
  setComposer(null);
  thinking(true);

  let live = null, text = "";
  const onToken = (chunk) => {
    thinking(false);
    if (!live) { live = bubble("them", ""); }
    text += chunk;
    live.textContent = text;
    live.appendChild(caret());
    scroll();
  };

  try {
    const evt = await post(payload, onToken);
    thinking(false);
    dropCaret(live);

    if (evt.event === "ask") {
      // A rejected draft plus a question is not a combination the server
      // produces, so anything streamed here was noise. Clear it.
      if (live) live.remove();
      openQuestion(evt.ask);
    } else if (evt.reply) {
      // No question came back, so the interview is over — sent, cancelled, or
      // never running in the first place.
      clearSlot();
      // Corrected text: either nothing was streamed, or what was streamed
      // failed the voice/pricing check and has been rewritten.
      if (live) live.textContent = evt.reply;
      else bubble("them", evt.reply);
    }
  } finally {
    thinking(false);
    busy = false;
    setComposer(asking);
    scroll();
  }
}

function caret() { const c = document.createElement("span"); c.className = "caret"; return c; }
function dropCaret(row) { const c = row && row.querySelector(".caret"); if (c) c.remove(); }

/* ── The interview ─────────────────────────────────────────── */

function openQuestion(ask) {
  // The agent's own line still belongs in the conversation. The question does not.
  if (ask.opening) bubble("them", ask.opening);
  stripHello();

  if (ask.type === "confirm") {
    // The read-back is the record of every answer, so it goes in the
    // transcript where it can be as long as it needs to be and scrolls with
    // the page, rather than in the height-capped slot.
    clearSlot();
    bubble("them", ask.message);
    messages.appendChild(recap(ask));
    scroll();
  } else {
    showCard(questionCard(ask));
  }

  progress(ask.step, ask.total);
  asking = ask;
}

/**
 * Put a card in the slot, moving the one that was there out of the way.
 *
 * The outgoing card is taken out of the flow before it animates, so the two
 * never push each other around mid-swap. The timeout is the belt to the
 * animationend braces: with animations disabled the event never fires, and a
 * card left in the slot would sit behind the next one forever.
 */
function showCard(card) {
  const leaving = slot.firstElementChild;
  if (leaving) {
    leaving.classList.add("qcard--out");
    leaving.addEventListener("animationend", () => leaving.remove(), { once: true });
    setTimeout(() => leaving.remove(), 400);
  }
  card.classList.add("qcard--in");
  slot.appendChild(card);
  scroll();
}

/** The interview is over, one way or another. */
function clearSlot() {
  const leaving = slot.firstElementChild;
  if (!leaving) return;
  leaving.classList.add("qcard--out");
  setTimeout(() => leaving.remove(), 400);
}

/** One segment per question: answered and current filled, the rest empty. */
function meter(step, total) {
  const bar = document.createElement("div");
  bar.className = "qcard__meter";
  bar.setAttribute("aria-hidden", "true");
  for (let n = 1; n <= total; n++) {
    const segment = document.createElement("span");
    if (n < step) segment.className = "done";
    else if (n === step) segment.className = "now";
    bar.appendChild(segment);
  }
  return bar;
}

/**
 * One question, as a card.
 *
 * Everything that needs the keyboard or the file picker stays at the bottom of
 * the screen where the composer is — the card holds the question, the count,
 * and any answer that can be given by tapping.
 */
function questionCard(ask) {
  const field = ask.field || null;
  const ui = ask.ui || {};
  const t = (key, english) => ui[key] || english;

  const card = document.createElement("div");
  card.className = "qcard reveal";

  const head = document.createElement("div");
  head.className = "qcard__head";
  const question = document.createElement("div");
  question.className = "qcard__q";
  question.textContent = ask.message;
  head.appendChild(question);

  // Not on the read-back. It is a review of what has been answered, not one of
  // the questions — numbering it says "Question 10 of 10" over a card that
  // asked nothing, and makes the photo step look like it never happened.
  if (ask.step && ask.total && ask.type !== "confirm") {
    const count = document.createElement("span");
    count.className = "qcard__count";
    count.textContent = ask.step_label || ask.step + " / " + ask.total;
    head.appendChild(count);
    head.appendChild(meter(ask.step, ask.total));
  }
  card.appendChild(head);

  const row = (label, opts = {}) => {
    const r = document.createElement("button");
    r.type = "button";
    r.className = "qcard__row" + (opts.quiet ? " qcard__row--quiet" : "");

    if (opts.badge !== false) {
      const badge = document.createElement("span");
      badge.className = "qcard__n";
      if (opts.index) badge.textContent = opts.index;
      else if (opts.icon) badge.appendChild(icon(opts.icon));
      r.appendChild(badge);
    }

    const text = document.createElement("span");
    text.className = "qcard__label";
    text.textContent = label;
    r.appendChild(text);

    if (opts.aside) {
      const aside = document.createElement("span");
      aside.className = "qcard__aside";
      aside.textContent = opts.aside;
      r.appendChild(aside);
    } else if (opts.index) {
      const go = icon("arrow-right");
      go.classList.add("qcard__go");
      r.appendChild(go);
    }
    r.addEventListener("click", opts.onClick);
    card.appendChild(r);
    return r;
  };

  if (field && field.kind === "select" && field.options && field.options.length) {
    // Shows the customer's language, sends back the English value Python
    // matches against.
    const labels = field.option_labels || field.options;
    field.options.forEach((option, i) => {
      const label = labels[i] || option;
      row(label, { index: String(i + 1), onClick: () => answer({ answer: option }) });
    });
    // The message box never goes away, and this says so.
    row(t("something_else", "Something else"), {
      quiet: true,
      icon: "pencil-simple",
      aside: ask.skippable ? t("skip", "Skip") : "",
      onClick: (e) => {
        // The Skip pill sits inside the row, so which half was tapped matters.
        if (ask.skippable && e.target.classList.contains("qcard__aside")) {
          answer({ skip: true });
        } else {
          input.focus();
        }
      },
    });
  } else if (field && field.kind === "date") {
    /*
     * Two taps, deliberately.
     *
     * On iOS the date wheel fires `change` the moment it settles on a value,
     * so answering on `change` answered the question with whatever date the
     * wheel happened to land on. Picking and confirming are separate.
     */
    const pick = row(t("pick_date", "Pick a date"), { icon: "calendar-blank", onClick: () => {} });
    pick.classList.add("qcard__row--date");

    const day = document.createElement("input");
    day.type = "date";
    day.className = "qcard__date";
    day.min = new Date().toISOString().slice(0, 10);
    pick.appendChild(day);

    const confirm = row(t("use_date", "Use this date"), {
      icon: "check",
      onClick: () => { if (day.value) answer({ answer: day.value }); },
    });
    confirm.classList.add("qcard__row--use");
    confirm.hidden = true;

    day.addEventListener("change", () => {
      // Never answer from in here. See above.
      if (!day.value) return;
      pick.querySelector(".qcard__label").textContent = prettyDate(day.value);
      confirm.hidden = false;
      scroll();
    });

    const notSure = t("not_sure", "Not sure yet");
    row(notSure, { quiet: true, icon: "question", onClick: () => answer({ skip: true }) });
  } else if (ask.skippable && ask.type !== "photos") {
    // Photos keep their skip beside the thumbnails, where the picker is, and
    // the date step's skip is "Not sure yet" — a second, blanker one next to it
    // is two ways to say the same thing.
    row(t("skip", "Skip"), { quiet: true, icon: "arrow-bend-up-right", onClick: () => answer({ skip: true }) });
  }

  return card;
}

/** The answers laid out to be checked, not read. */
function recap(ask) {
  const card = document.createElement("div");
  card.className = "recap reveal";

  const dl = document.createElement("dl");
  (ask.summary || []).forEach((row) => {
    const dt = document.createElement("dt");
    dt.textContent = row.label;
    const dd = document.createElement("dd");
    dd.textContent = row.value;      // typed by the customer — never innerHTML
    dl.append(dt, dd);
  });
  card.appendChild(dl);

  if (ask.photo_count) {
    const pics = document.createElement("div");
    pics.className = "pics";
    // Built server-side: pluralisation is a per-language rule and this is the
    // one string where getting it wrong is visible.
    pics.append(icon("images"), ask.photos_line || ask.photo_count + " photos attached");
    card.appendChild(pics);
  }

  return card;
}

/**
 * Reshape the composer around whatever is being asked.
 *
 * The input never moves and never disappears — choices and photos appear
 * above it. Someone who wants to type "actually, hold on" can always do
 * that, at any point, which is the difference between a conversation and
 * a form wearing a conversation's clothes.
 */
function setComposer(ask) {
  assist.textContent = "";
  clip.hidden = true;
  input.disabled = false;

  // Not every step has a field: the photo step and the read-back are their own
  // kinds of turn. This runs inside exchange()'s `finally`, so a throw here
  // would silently leave the composer without its buttons.
  const field = (ask && ask.field) || null;
  const kind = !ask ? "chat" : field ? field.kind : ask.type;

  // Server-supplied and already translated, with the English as the fallback
  // for a plain chat turn where there is no interview running.
  const ui = (ask && ask.ui) || {};
  const t = (key, english) => ui[key] || english;

  input.placeholder =
    kind === "photos" ? t("or_type", "Or type something…")
    // The choices are on the card; this box is the way past them.
    : kind === "select" ? t("or_reply", "Or reply directly…")
    : field && field.placeholder ? field.placeholder
    : ask ? t("type_answer", "Type your answer…")
    : "Ask about your move…";

  // Choices and Skip live on the question card. Only the things that need this
  // end of the screen — the file picker and the read-back's buttons — are
  // rendered into `assist`.

  if (kind === "confirm") {
    const send = t("send", "Send it over"), over = t("restart", "Start over");
    assist.appendChild(button(send, () => answer({ confirmed: true }), false, "paper-plane-tilt"));
    assist.appendChild(button(over, () => answer({ restart: true }), true, "arrow-counter-clockwise"));
    input.placeholder = t("or_change", "Or tell me what to change…");
    sync();
    return;
  }

  if (kind === "photos") {
    clip.hidden = false;
    renderShots();
    if (photos.some((p) => p.id)) {
      assist.appendChild(button(t("send_photos", "Send these"), () => {
        answer({ photo_ids: photos.filter((p) => p.id).map((p) => p.id) });
      }, false, "check"));
    } else {
      assist.appendChild(button(t("add_photos", "Add photos"), () => picker.click(), false, "camera"));
    }
    const later = t("skip_photos", "Skip for now");
    assist.appendChild(button(later, () => answer({ photo_ids: [] }), true));
  }

  sync();
}

function button(label, onClick, quiet, iconName) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "opt" + (quiet ? " quiet" : "");
  if (iconName) b.appendChild(icon(iconName));
  b.appendChild(document.createTextNode(label));
  b.addEventListener("click", onClick);
  return b;
}

function prettyDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined,
    { weekday: "short", month: "long", day: "numeric" });
}

/**
 * Answer whatever is on the card.
 *
 * Deliberately no echo into the transcript. The question is replaced by the
 * next one, and an answer left behind on its own — "90026", "Nik" — is a
 * fragment with nothing to say what it was. The read-back at the end shows
 * every answer with its label.
 */
function answer(reply) {
  if (reply.photo_ids) photos = [];
  exchange({ reply });
}

/* ── Composer wiring ───────────────────────────────────────── */

function sync() {
  sendBtn.disabled = busy || !input.value.trim();
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
}

function submitTyped() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  sync();
  // While a question is open, typing IS the answer — same protocol, so the
  // server never mistakes it for a new conversation.
  if (asking && asking.type === "confirm") answer({ restart: true });
  else if (asking) answer({ answer: text });
  // Outside the interview this is an ordinary message, and it does belong in
  // the transcript.
  else exchange({ message: text }, text);
}

input.addEventListener("input", sync);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitTyped(); }
});
sendBtn.addEventListener("click", submitTyped);
clip.addEventListener("click", () => picker.click());
picker.addEventListener("change", () => {
  addPhotos(Array.from(picker.files || []));
  picker.value = "";
});

document.querySelectorAll(".chip").forEach((c) =>
  c.addEventListener("click", () => exchange({ message: c.textContent.trim() }, c.textContent.trim())));

// A reload IS a fresh conversation now, so this needs nothing else.
el("restart").addEventListener("click", () => location.reload());

/* ── Photos ────────────────────────────────────────────────── */

function renderShots() {
  photos.forEach((photo, i) => {
    const cell = document.createElement("div");
    cell.className = "shot" + (photo.id ? "" : " pending");
    const img = document.createElement("img");
    img.src = photo.url; img.alt = "";
    cell.appendChild(img);
    if (photo.id) {
      const x = document.createElement("button");
      x.type = "button";
      x.appendChild(icon("x"));
      x.setAttribute("aria-label", "Remove photo");
      x.addEventListener("click", () => {
        URL.revokeObjectURL(photo.url);
        photos.splice(i, 1);
        setComposer(asking);
      });
      cell.appendChild(x);
    }
    assist.appendChild(cell);
  });
}

async function addPhotos(files) {
  for (const file of files) {
    // Shown immediately and greyed, so a slow upload on cell data still feels
    // like something happened when they tapped.
    const entry = { id: null, url: URL.createObjectURL(file) };
    photos.push(entry);
    setComposer(asking);

    const body = new FormData();
    body.append("thread_id", threadId);
    body.append("file", file);
    try {
      const res = await fetch("/api/upload", { method: "POST", body });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "That upload didn't go through.");
      entry.id = data.id;
      setComposer(asking);
    } catch (err) {
      photos = photos.filter((p) => p !== entry);
      URL.revokeObjectURL(entry.url);
      setComposer(asking);
      const warn = document.createElement("div");
      warn.className = "warn";
      warn.appendChild(icon("warning-circle"));
      warn.appendChild(document.createTextNode(err.message));
      assist.appendChild(warn);
      setTimeout(() => warn.remove(), 5000);
    }
  }
}

/* ── Boot ──────────────────────────────────────────────────── */

sync();
if (window.matchMedia("(min-width: 640px)").matches) input.focus({ preventScroll: true });
</script>
</body>
</html>
