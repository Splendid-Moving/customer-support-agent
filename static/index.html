<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fbfbf9" />
<title>Splendid Moving — chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   Light, quiet, type-led.

   The restraint is the point. This page is the first contact
   someone has with a company they are about to let carry
   everything they own, and a busy interface reads as a sales
   funnel. One accent colour, one type family, a lot of white,
   and nothing on screen that isn't doing a job.

   The agent's replies are set flush as plain text rather than
   in bubbles — bubbles on both sides is the universal look of
   a support widget, and this should read like a conversation.
   ───────────────────────────────────────────────────────────── */

:root {
  --bg:        #fbfbf9;
  --surface:   #ffffff;
  --ink:       #10233a;
  --ink-deep:  #032449;
  --muted:     #6d7887;
  --faint:     #99a2ae;
  --line:      #e9e8e4;
  --accent:    #188bf6;
  --accent-dp: #0f6fce;
  --accent-bg: #eef5ff;
  --danger:    #b23c26;

  --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --gut: clamp(1.15rem, 5vw, 2rem);
  --r: 12px;

  color-scheme: light;
}

* { box-sizing: border-box; }

/* The `hidden` attribute hides an element through a UA-stylesheet rule, and ANY
   author rule that sets `display` beats it. `.icon` sets display:grid, so the
   attach-photos button was marked hidden at every step of the conversation and
   visible at every step of the conversation — inviting people to attach a
   photo before anyone had asked for one. */
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.app {
  height: 100dvh;
  max-width: 720px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}

/* ── Header ─────────────────────────────────────────────── */

header.bar {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: 1rem var(--gut) .85rem;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(8px);
  position: relative;
}

.avatar {
  width: 34px; height: 34px; flex: none;
  border-radius: 50%;
  background: var(--ink-deep);
  color: #fff;
  display: grid; place-items: center;
  font-size: .82rem; font-weight: 600; letter-spacing: .01em;
}

.who-name { font-weight: 600; font-size: .95rem; letter-spacing: -.01em; line-height: 1.25; }
.who-sub {
  display: flex; align-items: center; gap: .38rem;
  font-size: .78rem; color: var(--faint);
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: #34a853; }


.bar .grow { flex: 1; }

.linkbtn {
  border: 0; background: none; font: inherit;
  font-size: .82rem; color: var(--muted);
  padding: .5rem .35rem; cursor: pointer; border-radius: 8px;
  min-height: 40px;
}
.linkbtn:hover { color: var(--ink); }
.linkbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Progress rail during the estimate interview. Two pixels of
   reassurance that this has an end. */
.rail {
  position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: transparent;
}
.rail i {
  display: block; height: 100%; width: 0;
  background: var(--accent);
  transition: width .45s cubic-bezier(.22,.9,.28,1);
}

/* ── Thread ─────────────────────────────────────────────── */

.thread {
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: clamp(1.5rem, 6vw, 2.75rem) var(--gut) .75rem;
  scrollbar-width: thin;
  scrollbar-color: #dcdbd6 transparent;
}
.thread::-webkit-scrollbar { width: 7px; }
.thread::-webkit-scrollbar-thumb { background: #dcdbd6; border-radius: 99px; }

.hello { max-width: 30ch; margin-bottom: 2.25rem; }
.hello h1 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(2.15rem, 9vw, 2.9rem);
  line-height: 1.05;
  letter-spacing: -.02em;
  color: var(--ink-deep);
  margin: 0 0 .5rem;
}
.hello h1 em { font-style: italic; }
.hello p { margin: 0; color: var(--muted); font-size: 1rem; }

.chips { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: 1.5rem; }
.chip {
  font: inherit; font-size: .88rem;
  padding: .55rem .9rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer; min-height: 42px;
  transition: border-color .16s, background .16s, transform .16s;
}
.chip:hover { border-color: var(--accent); background: var(--accent-bg); transform: translateY(-1px); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.reveal { animation: rise .5s cubic-bezier(.22,.9,.28,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Messages */
.msg { margin-bottom: 1.6rem; max-width: 60ch; }
.msg.them { white-space: pre-wrap; }
.msg.them p { margin: 0 0 .75rem; }
.msg.them p:last-child { margin-bottom: 0; }

.msg.me {
  margin-left: auto;
  width: fit-content;
  max-width: min(42ch, 85%);
  background: var(--ink-deep);
  color: #fff;
  padding: .6rem .95rem;
  border-radius: 16px 16px 5px 16px;
  font-size: .96rem;
}

/* The question, as a card in the conversation rather than a line in the
   header. The count belongs here: "how many more of these are there" is
   the question someone has three answers in, and it is worth nothing in
   a corner they are not looking at.

   Choices are rows rather than chips because a row can be read down at a
   glance and stays legible at six options on a phone, where a wrapped
   line of pills does not. */
.qcard {
  max-width: 60ch;
  margin-bottom: 1.6rem;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  overflow: hidden;
}
.qcard__head {
  display: flex; align-items: baseline; gap: 1rem;
  padding: .85rem .95rem;
}
.qcard__head + .qcard__row { border-top: 1px solid var(--line); }
.qcard__q { flex: 1; font-size: .98rem; line-height: 1.45; white-space: pre-wrap; }
.qcard__count { font-size: .78rem; color: var(--faint); white-space: nowrap; }

.qcard__row {
  display: flex; align-items: center; gap: .7rem;
  width: 100%;
  padding: .65rem .95rem;
  border: 0;
  background: none; color: inherit;
  font: inherit; font-size: .93rem; text-align: left;
  cursor: pointer; min-height: 48px;
  transition: background .15s;
}
.qcard__row + .qcard__row { border-top: 1px solid var(--line); }
.qcard__row:hover { background: var(--accent-bg); }
.qcard__row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* Indexes the list. The whole row is the target — this is a label, not a
   keyboard shortcut, because the composer is focused and a digit typed
   there has to stay a digit. */
.qcard__n {
  display: grid; place-items: center;
  width: 26px; height: 26px; flex-shrink: 0;
  border-radius: 7px;
  background: var(--bg);
  font-size: .78rem; color: var(--faint);
}
.qcard__row--quiet { color: var(--muted); }
.qcard__aside {
  margin-left: auto;
  font-size: .8rem; color: var(--muted);
  border: 1px solid var(--line); border-radius: 8px;
  padding: .25rem .55rem; background: var(--bg);
}

/* Answered. It stays on screen as part of the transcript, but nothing in
   it is clickable any more — otherwise an option from three questions ago
   is still live. */
.qcard--done { opacity: .62; }
.qcard--done .qcard__row { cursor: default; pointer-events: none; }
.qcard--done .qcard__aside { display: none; }

/* The read-back before anything is sent. Given a surface of its own —
   it is the one thing on the page the customer is asked to check rather
   than read, and it should not look like another message. */
.recap {
  max-width: 60ch;
  margin-bottom: 1.6rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  overflow: hidden;
}
.recap dl { margin: 0; display: grid; grid-template-columns: minmax(7.5rem, auto) 1fr; }
.recap dt, .recap dd {
  margin: 0;
  padding: .6rem .95rem;
  border-bottom: 1px solid var(--line);
  font-size: .92rem;
}
.recap dt { color: var(--muted); font-size: .82rem; }
.recap dd { color: var(--ink); font-weight: 500; overflow-wrap: anywhere; }
.recap dl > :nth-last-child(-n+2) { border-bottom: 0; }
.recap .pics {
  padding: .6rem .95rem;
  border-top: 1px solid var(--line);
  font-size: .85rem;
  color: var(--muted);
}
@media (max-width: 480px) {
  .recap dl { grid-template-columns: 1fr; }
  .recap dt { padding-bottom: 0; border-bottom: 0; }
  .recap dd { padding-top: .1rem; }
}

/* The caret that follows the streaming text. */
.caret {
  display: inline-block;
  width: 2px; height: 1.05em;
  background: var(--accent);
  margin-left: 2px;
  vertical-align: -.18em;
  animation: blink 1.05s steps(2, start) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.thinking { display: flex; gap: 4px; margin-bottom: 1.6rem; }
.thinking i {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--faint);
  animation: bob 1.2s ease-in-out infinite;
}
.thinking i:nth-child(2) { animation-delay: .15s; }
.thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%,60%,100% { opacity: .3; transform: none; } 30% { opacity: 1; transform: translateY(-4px); } }

/* ── Composer ───────────────────────────────────────────── */

footer.composer {
  padding: .7rem var(--gut) calc(.9rem + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
}

/* Choice chips and photo thumbnails sit above the input, so the
   answer always appears in the same place whatever its shape. */
.assist { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .6rem; }
.assist:empty { display: none; }

.opt {
  font: inherit; font-size: .87rem;
  padding: .5rem .85rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
  cursor: pointer; min-height: 40px;
  transition: border-color .15s, background .15s;
}
.opt:hover { border-color: var(--accent); background: var(--accent-bg); }
.opt.quiet { color: var(--muted); border-style: dashed; }
.opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.box {
  display: flex; align-items: flex-end; gap: .4rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: .3rem .3rem .3rem .85rem;
  transition: border-color .15s, box-shadow .15s;
}
.box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }

.box textarea, .box input[type="date"] {
  flex: 1; border: 0; background: none; color: inherit;
  font: inherit; outline: none; resize: none;
  padding: .55rem 0; max-height: 120px; line-height: 1.5;
  min-width: 0;
}
.box textarea::placeholder { color: var(--faint); }

.icon {
  width: 40px; height: 40px; flex: none;
  border: 0; border-radius: 9px;
  background: none; color: var(--muted);
  display: grid; place-items: center; cursor: pointer;
  transition: background .15s, color .15s;
}
.icon:hover { background: var(--accent-bg); color: var(--accent-dp); }
.icon:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon svg { width: 19px; height: 19px; }

.go {
  width: 40px; height: 40px; flex: none;
  border: 0; border-radius: 9px;
  background: var(--ink-deep); color: #fff;
  display: grid; place-items: center; cursor: pointer;
  transition: opacity .15s, background .15s;
}
.go:hover:not(:disabled) { background: var(--accent-dp); }
.go:disabled { opacity: .28; cursor: default; }
.go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.go svg { width: 18px; height: 18px; }

.foot {
  margin: .55rem 0 0; text-align: center;
  font-size: .74rem; color: var(--faint);
}
.foot a { color: inherit; }

/* Builder credit. Deliberately the quietest thing on the page — this is
   Splendid Moving's chat, and the badge should be findable rather than
   noticeable. */
.by { margin: .3rem 0 0; text-align: center; font-size: .7rem; }
.by a {
  color: var(--faint);
  text-decoration: none;
  letter-spacing: .01em;
  transition: color .15s;
}
.by a:hover { color: var(--accent); text-decoration: underline; }
.by a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* Photo thumbnails */
.shot {
  position: relative; width: 54px; height: 54px;
  border-radius: 9px; overflow: hidden; border: 1px solid var(--line);
  animation: rise .3s cubic-bezier(.22,.9,.28,1) both;
}
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot.pending { opacity: .4; }
.shot button {
  position: absolute; top: 2px; right: 2px;
  width: 19px; height: 19px; border: 0; border-radius: 50%;
  background: rgba(3,36,73,.82); color: #fff;
  font-size: .72rem; line-height: 1; cursor: pointer; padding: 0;
}

.warn { color: var(--danger); font-size: .82rem; flex-basis: 100%; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .reveal { opacity: 1; }
}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="avatar" aria-hidden="true">{{AGENT_INITIAL}}</div>
    <div>
      <div class="who-name">{{AGENT_NAME}} · Splendid Moving</div>
      <div class="who-sub"><span class="dot"></span> Replies instantly</div>
    </div>
    <div class="grow"></div>
    <button class="linkbtn" id="restart" type="button">Start over</button>
    <div class="rail"><i id="rail"></i></div>
  </header>

  <main class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation">
    <div class="hello" id="hello">
      <h1 class="reveal">Hi, I'm <em>{{AGENT_NAME}}</em>.</h1>
      <p class="reveal" style="animation-delay:.1s">
        I'm in the office here at Splendid Moving. Ask me anything about your
        move, or I'll take a few details and get you a real estimate.
      </p>
      <!-- Two things people came to do, then the four questions they actually
           ask. Every one of these is answered outright by knowledge/ — a
           suggestion that leads to "I'm not sure, let me have someone call
           you" is worse than no suggestion. -->
      <div class="chips reveal" style="animation-delay:.2s">
        <button class="chip" type="button">I'd like an estimate</button>
        <button class="chip" type="button">How much do you charge?</button>
        <button class="chip" type="button">Moving out of state</button>
        <button class="chip" type="button">What's included?</button>
        <button class="chip" type="button">Any hidden fees?</button>
        <button class="chip" type="button">Is my stuff insured?</button>
      </div>
    </div>
  </main>

  <footer class="composer">
    <div class="assist" id="assist"></div>
    <div class="box" id="box">
      <textarea id="input" rows="1" placeholder="Ask about your move…"
                aria-label="Your message" autocomplete="off"></textarea>
      <button class="icon" id="clip" type="button" aria-label="Add photos" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input type="file" id="picker" accept="image/*" multiple hidden />
      <button class="go" id="send" type="button" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
      </button>
    </div>
    <p class="foot">Or call any day, 6am–11pm — <a href="tel:+13236452636">(323) 645-2636</a></p>
    <p class="by"><a href="https://simple-flow.co" target="_blank" rel="noopener noreferrer">Built by Simple&nbsp;Flow</a></p>
  </footer>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   Three things in here are load-bearing.

   1. THE RESUME PROTOCOL. While the agent is part-way through
      the estimate questions the server is genuinely paused. An
      ordinary chat message at that point would restart the whole
      conversation, so answers go out as {reply: ...} instead.

   2. TOKENS ARRIVE BEFORE THE ANSWER IS APPROVED. The server
      streams the model's draft as it is written, and the voice
      and pricing checks only finish afterwards. If the draft is
      rejected the `done` event carries corrected text, and we
      swap it in. Usually it doesn't, and nothing happens.

   3. PHOTOS UPLOAD SEPARATELY, before the answer is sent. Only
      their ids ever travel through the conversation.
   ───────────────────────────────────────────────────────────── */

const el = (id) => document.getElementById(id);
const thread = el("thread"), input = el("input"), sendBtn = el("send");
const assist = el("assist"), clip = el("clip"), picker = el("picker"), rail = el("rail");

/* Deliberately NOT persisted. A reload starts a fresh conversation.
   The thread id used to live in localStorage and outlive the page, which meant
   a reloaded page drew the welcome screen while the server was still waiting on
   a question — and the first chip tapped was sent as the ANSWER to that unseen
   question. The interview is short enough that starting over costs less than
   any of the ways of putting someone back where they were. */
let threadId = "";
let busy = false;
let asking = null;      // the question the agent is currently waiting on
let liveCard = null;    // its card in the thread, until it is answered
let photos = [];        // [{id, url}] for the photo step

/* ── Rendering ─────────────────────────────────────────────── */

function stripHello() { const h = el("hello"); if (h) h.remove(); }

function bubble(who, text) {
  stripHello();
  const row = document.createElement("div");
  row.className = "msg " + who + " reveal";
  row.textContent = text || "";
  thread.appendChild(row);
  scroll();
  return row;
}

function thinking(on) {
  const existing = el("dots");
  if (!on) { if (existing) existing.remove(); return; }
  if (existing) return;
  const row = document.createElement("div");
  row.className = "thinking"; row.id = "dots";
  row.innerHTML = "<i></i><i></i><i></i>";
  thread.appendChild(row);
  scroll();
}

let pinned = true;
thread.addEventListener("scroll", () => {
  pinned = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 60;
});
function scroll() {
  if (!pinned) return;
  requestAnimationFrame(() => { thread.scrollTop = thread.scrollHeight; });
}

/**
 * The hairline across the top of the header.
 *
 * Ambient only. The number a customer actually wants — "3 of 9" — is on the
 * question card, where they are already looking; up here it was a corner
 * nobody reads.
 */
function progress(step, total) {
  rail.style.width = step && total ? Math.round((step / total) * 100) + "%" : "0";
}

/* ── Talking to the server ─────────────────────────────────── */

async function post(payload, onToken) {
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ thread_id: threadId, ...payload }),
  });

  if (!res.ok) {
    let msg = "Something went wrong on my end. Try again in a moment?";
    try { msg = (await res.json()).error || msg; } catch (_) {}
    return { event: "done", reply: msg };
  }

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", last = null;

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });

    let cut;
    while ((cut = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0, cut).trim();
      buf = buf.slice(cut + 2);
      if (!raw.startsWith("data:")) continue;
      let evt; try { evt = JSON.parse(raw.slice(5)); } catch (_) { continue; }

      if (evt.event === "start") {
        // Held for this page view only, so the rest of the conversation lands
        // on the same thread.
        threadId = evt.thread_id;
      } else if (evt.event === "token") {
        onToken(evt.text);
      } else {
        last = evt;
      }
    }
  }
  return last || { event: "done", reply: "I lost that one — say it again?" };
}

async function exchange(payload, echo) {
  if (busy) return;
  busy = true;
  asking = null;
  // Whatever was on screen has now been answered — or superseded by the
  // customer typing something else entirely. Either way it is history.
  if (liveCard) { liveCard.classList.add("qcard--done"); liveCard = null; }
  progress(0, 0);
  if (echo) bubble("me", echo);
  setComposer(null);
  thinking(true);

  let live = null, text = "";
  const onToken = (chunk) => {
    thinking(false);
    if (!live) { live = bubble("them", ""); }
    text += chunk;
    live.textContent = text;
    live.appendChild(caret());
    scroll();
  };

  try {
    const evt = await post(payload, onToken);
    thinking(false);
    dropCaret(live);

    if (evt.event === "ask") {
      // A rejected draft plus a question is not a combination the server
      // produces, so anything streamed here was noise. Clear it.
      if (live) live.remove();
      openQuestion(evt.ask);
    } else if (evt.reply) {
      // Corrected text: either nothing was streamed, or what was streamed
      // failed the voice/pricing check and has been rewritten.
      if (live) live.textContent = evt.reply;
      else bubble("them", evt.reply);
    }
  } finally {
    thinking(false);
    busy = false;
    setComposer(asking);
    scroll();
  }
}

function caret() { const c = document.createElement("span"); c.className = "caret"; return c; }
function dropCaret(row) { const c = row && row.querySelector(".caret"); if (c) c.remove(); }

/* ── The interview ─────────────────────────────────────────── */

function openQuestion(ask) {
  if (ask.opening) bubble("them", ask.opening);

  if (ask.type === "confirm") {
    // The read-back is already a surface of its own, and it is a summary
    // rather than a question. It keeps its own shape.
    bubble("them", ask.message);
    recap(ask);
  } else {
    questionCard(ask);
  }

  progress(ask.step, ask.total);
  asking = ask;
}

/**
 * One question, as a card.
 *
 * Everything that needs the keyboard or the file picker stays at the bottom of
 * the screen where the composer is — the card holds the question, the count,
 * and any answer that can be given by tapping.
 */
function questionCard(ask) {
  stripHello();
  const field = ask.field || null;
  const ui = ask.ui || {};
  const t = (key, english) => ui[key] || english;

  const card = document.createElement("div");
  card.className = "qcard reveal";

  const head = document.createElement("div");
  head.className = "qcard__head";
  const question = document.createElement("div");
  question.className = "qcard__q";
  question.textContent = ask.message;
  head.appendChild(question);

  if (ask.step && ask.total) {
    const count = document.createElement("span");
    count.className = "qcard__count";
    count.textContent = ask.step_label || ask.step + " / " + ask.total;
    head.appendChild(count);
  }
  card.appendChild(head);

  const row = (label, opts = {}) => {
    const r = document.createElement("button");
    r.type = "button";
    r.className = "qcard__row" + (opts.quiet ? " qcard__row--quiet" : "");

    const badge = document.createElement("span");
    badge.className = "qcard__n";
    badge.textContent = opts.index || (opts.quiet ? "✎" : "");
    r.appendChild(badge);

    const text = document.createElement("span");
    text.textContent = label;
    r.appendChild(text);

    if (opts.aside) {
      const aside = document.createElement("span");
      aside.className = "qcard__aside";
      aside.textContent = opts.aside;
      r.appendChild(aside);
    }
    r.addEventListener("click", opts.onClick);
    card.appendChild(r);
    return r;
  };

  if (field && field.kind === "select" && field.options && field.options.length) {
    // Shows the customer's language, sends back the English value Python
    // matches against.
    const labels = field.option_labels || field.options;
    field.options.forEach((option, i) => {
      const label = labels[i] || option;
      row(label, { index: String(i + 1), onClick: () => answer({ answer: option }, label) });
    });
    // The message box never goes away, and this says so.
    row(t("something_else", "Something else"), {
      quiet: true,
      aside: ask.skippable ? t("skip", "Skip") : "",
      onClick: (e) => {
        // The Skip pill sits inside the row, so which half was tapped matters.
        if (ask.skippable && e.target.classList.contains("qcard__aside")) {
          answer({ skip: true }, t("skip", "Skip"));
        } else {
          input.focus();
        }
      },
    });
  } else if (ask.skippable && ask.type !== "photos" && (!field || field.kind !== "date")) {
    // Photos keep their skip beside the thumbnails, where the picker is, and
    // the date step's skip is "Not sure yet" — a second, blanker one next to it
    // is two ways to say the same thing.
    row(t("skip", "Skip"), { quiet: true, onClick: () => answer({ skip: true }, t("skip", "Skip")) });
  }

  thread.appendChild(card);
  liveCard = card;
  scroll();
}

/** The answers laid out to be checked, not read. */
function recap(ask) {
  const card = document.createElement("div");
  card.className = "recap reveal";

  const dl = document.createElement("dl");
  (ask.summary || []).forEach((row) => {
    const dt = document.createElement("dt");
    dt.textContent = row.label;
    const dd = document.createElement("dd");
    dd.textContent = row.value;      // typed by the customer — never innerHTML
    dl.append(dt, dd);
  });
  card.appendChild(dl);

  if (ask.photo_count) {
    const pics = document.createElement("div");
    pics.className = "pics";
    // Built server-side: pluralisation is a per-language rule and this is the
    // one string where getting it wrong is visible.
    pics.textContent = ask.photos_line || ask.photo_count + " photos attached";
    card.appendChild(pics);
  }

  thread.appendChild(card);
  scroll();
}

/**
 * Reshape the composer around whatever is being asked.
 *
 * The input never moves and never disappears — choices and photos appear
 * above it. Someone who wants to type "actually, hold on" can always do
 * that, at any point, which is the difference between a conversation and
 * a form wearing a conversation's clothes.
 */
function setComposer(ask) {
  assist.textContent = "";
  clip.hidden = true;
  input.disabled = false;

  // Not every step has a field. The photo step and the read-back are their own
  // kinds of turn, and reading `.kind` off the field they do not have threw
  // right here — inside the `finally` that re-dresses the composer, so the
  // read-back arrived with its "Send it over" button never rendered and no
  // error visible anywhere. The step the whole interview leads to was the one
  // step you could not complete.
  const field = (ask && ask.field) || null;
  const kind = !ask ? "chat" : field ? field.kind : ask.type;

  // Server-supplied and already translated, with the English as the fallback
  // for a plain chat turn where there is no interview running.
  const ui = (ask && ask.ui) || {};
  const t = (key, english) => ui[key] || english;

  input.placeholder =
    kind === "photos" ? t("or_type", "Or type something…")
    // The choices are on the card; this box is the way past them.
    : kind === "select" ? t("or_reply", "Or reply directly…")
    : field && field.placeholder ? field.placeholder
    : ask ? t("type_answer", "Type your answer…")
    : "Ask about your move…";

  // Choices and Skip live on the question card now, not down here. Only the
  // things that need this end of the screen — the date picker, the file
  // picker, the read-back's buttons — are still rendered into `assist`.

  if (kind === "date") {
    const day = document.createElement("input");
    day.type = "date";
    day.className = "opt";
    day.min = new Date().toISOString().slice(0, 10);
    day.style.minWidth = "10rem";
    day.addEventListener("change", () => {
      if (day.value) answer({ answer: day.value }, prettyDate(day.value));
    });
    assist.appendChild(day);
    const notSure = t("not_sure", "Not sure yet");
    assist.appendChild(button(notSure, () => answer({ skip: true }, notSure), true));
  }

  if (kind === "confirm") {
    const send = t("send", "Send it over"), over = t("restart", "Start over");
    assist.appendChild(button(send, () => answer({ confirmed: true }, send)));
    assist.appendChild(button(over, () => answer({ restart: true }, over), true));
    input.placeholder = t("or_change", "Or tell me what to change…");
    sync();
    return;
  }

  if (kind === "photos") {
    clip.hidden = false;
    renderShots();
    if (photos.some((p) => p.id)) {
      assist.appendChild(button(t("send_photos", "Send these"), () => {
        answer({ photo_ids: photos.filter((p) => p.id).map((p) => p.id) },
               t("send_photos", "Send these"));
      }));
    } else {
      assist.appendChild(button(t("add_photos", "Add photos"), () => picker.click()));
    }
    const later = t("skip_photos", "Skip for now");
    assist.appendChild(button(later, () => answer({ photo_ids: [] }, later), true));
  }

  sync();
}

function button(label, onClick, quiet) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "opt" + (quiet ? " quiet" : "");
  b.textContent = label;
  b.addEventListener("click", onClick);
  return b;
}

function prettyDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined,
    { weekday: "short", month: "long", day: "numeric" });
}

function answer(reply, echo) {
  if (reply.photo_ids) photos = [];
  exchange({ reply }, echo);
}

/* ── Composer wiring ───────────────────────────────────────── */

function sync() {
  sendBtn.disabled = busy || !input.value.trim();
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
}

function submitTyped() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  sync();
  // While a question is open, typing IS the answer — same protocol, so the
  // server never mistakes it for a new conversation.
  if (asking && asking.type === "confirm") answer({ restart: true }, text);
  else if (asking) answer({ answer: text }, text);
  else exchange({ message: text }, text);
}

input.addEventListener("input", sync);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitTyped(); }
});
sendBtn.addEventListener("click", submitTyped);
clip.addEventListener("click", () => picker.click());
picker.addEventListener("change", () => {
  addPhotos(Array.from(picker.files || []));
  picker.value = "";
});

document.querySelectorAll(".chip").forEach((c) =>
  c.addEventListener("click", () => exchange({ message: c.textContent.trim() }, c.textContent.trim())));

// A reload IS a fresh conversation now, so this needs nothing else.
el("restart").addEventListener("click", () => location.reload());

/* ── Photos ────────────────────────────────────────────────── */

function renderShots() {
  photos.forEach((photo, i) => {
    const cell = document.createElement("div");
    cell.className = "shot" + (photo.id ? "" : " pending");
    const img = document.createElement("img");
    img.src = photo.url; img.alt = "";
    cell.appendChild(img);
    if (photo.id) {
      const x = document.createElement("button");
      x.type = "button"; x.textContent = "×";
      x.setAttribute("aria-label", "Remove photo");
      x.addEventListener("click", () => {
        URL.revokeObjectURL(photo.url);
        photos.splice(i, 1);
        setComposer(asking);
      });
      cell.appendChild(x);
    }
    assist.appendChild(cell);
  });
}

async function addPhotos(files) {
  for (const file of files) {
    // Shown immediately and greyed, so a slow upload on cell data still feels
    // like something happened when they tapped.
    const entry = { id: null, url: URL.createObjectURL(file) };
    photos.push(entry);
    setComposer(asking);

    const body = new FormData();
    body.append("thread_id", threadId);
    body.append("file", file);
    try {
      const res = await fetch("/api/upload", { method: "POST", body });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "That upload didn't go through.");
      entry.id = data.id;
      setComposer(asking);
    } catch (err) {
      photos = photos.filter((p) => p !== entry);
      URL.revokeObjectURL(entry.url);
      setComposer(asking);
      const warn = document.createElement("div");
      warn.className = "warn";
      warn.textContent = err.message;
      assist.appendChild(warn);
      setTimeout(() => warn.remove(), 5000);
    }
  }
}

/* ── Boot ──────────────────────────────────────────────────── */

sync();
if (window.matchMedia("(min-width: 640px)").matches) input.focus({ preventScroll: true });
</script>
</body>
</html>
